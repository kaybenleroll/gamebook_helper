services:
  gamebook-app:
    build: .
    container_name: gamebook-app
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - gamebook_node_modules:/app/node_modules
      - /app/.next
      - gamebook_db:/app/data
    environment:
      NODE_ENV: development
      DATABASE_URL: /app/data/gamebook.db
    networks:
      - gamebook-network

  gamebook-playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-noble
    volumes:
      - .:/app
      - gamebook_node_modules:/app/node_modules
    working_dir: /app
    environment:
      PLAYWRIGHT_BASE_URL: http://gamebook-app:3000
    networks:
      - gamebook-network
    profiles:
      - test

networks:
  gamebook-network:
    driver: bridge

volumes:
  gamebook_node_modules:
  gamebook_db:
